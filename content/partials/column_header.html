<!-- Shared StatPlay header. Rendered by scripts/site_header.py on every page. -->
<nav id="mainNav" class="$classes" aria-label="$navigation_label">
  <a class="logo" href="$home_href" aria-label="$home_label">StatPlay</a>
  <button class="nav-toggle" id="navToggle" aria-label="$menu_label" aria-controls="navLinks" aria-expanded="false" type="button"><span class="bars" aria-hidden="true"></span></button>
  <div class="nav-links" id="navLinks">$links</div>
  <div class="site-utilities">
    <button id="themeToggle" class="lang-toggle theme-toggle" type="button" aria-label="$theme_label" aria-pressed="false">LIGHT</button>
    $language
  </div>
</nav>
